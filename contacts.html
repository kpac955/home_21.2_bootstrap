<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ackerman - Контакты</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        main { display: flex; height: 100vh; }
        .sidebar { width: 280px; flex-shrink: 0; }
        .content { flex-grow: 1; overflow-y: auto; padding: 40px; background-color: #f8f9fa; }
    </style>
</head>
<body>
<main>
    <div class="d-flex flex-column flex-shrink-0 p-3 text-bg-dark sidebar">
        <span class="fs-4">Меню</span>
        <hr>
        <ul class="nav nav-pills flex-column mb-auto">
            <li><a href="index.html" class="nav-link text-white">Главная</a></li>
            <li><a href="catalog.html" class="nav-link text-white">Каталог</a></li>
            <li><a href="category.html" class="nav-link text-white">Категории</a></li>
            <li><a href="contacts.html" class="nav-link active">Контакты</a></li>
        </ul>
        <hr>
        <div class="dropdown">
            <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle"
               data-bs-toggle="dropdown" aria-expanded="false">
                <img src="https://github.com/mdo.png" alt="" width="32" height="32" class="rounded-circle me-2">
                <strong>Пользователь</strong>
            </a>
            <ul class="dropdown-menu dropdown-menu-dark text-small shadow">
                <li><a class="dropdown-item" href="#">Профиль</a></li>
                <li><a class="dropdown-item" href="#">Настройки</a></li>
                <li>
                    <hr class="dropdown-divider">
                </li>
                <li><a class="dropdown-item" href="#">Выйти</a></li>
            </ul>
        </div>
    </div>
    <div class="content">
        <div class="text-center mb-5">
            <h1 class="display-4 fw-normal">Контакты</h1>
        </div>

        <div class="row g-5">
            <div class="col-md-6">
                <form method="POST" class="p-4 border rounded shadow-sm bg-white">
                    <div class="mb-3">
                        <label class="form-label">Имя</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Сообщение</label>
                        <textarea name="message" class="form-control" rows="3"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Отправить данные</button>
                </form>
            </div>
            <div class="col-md-6">
                <h3>Свяжитесь с нами</h3>
                <p>Этот файл будет возвращаться сервером на любой запрос.</p>
                <p class="text-muted">Заполните форму слева, чтобы проверить обработку POST-запроса в консоли
                    PyCharm.</p>
            </div>
        </div>
    </div>
</main>
</body>
</html>
